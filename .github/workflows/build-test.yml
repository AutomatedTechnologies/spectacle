name: Build Test

on:
  push:
    branches: [build-test]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch Sparkle 1.22.0 (official prebuilt)
        run: |
          set -euo pipefail
          curl -L -o /tmp/Sparkle-1.22.0.tar.bz2 https://github.com/sparkle-project/Sparkle/releases/download/1.22.0/Sparkle-1.22.0.tar.bz2
          mkdir -p /tmp/sparkle-extract
          tar -xjf /tmp/Sparkle-1.22.0.tar.bz2 -C /tmp/sparkle-extract
          find /tmp/sparkle-extract -maxdepth 3 -print
          test -d /tmp/sparkle-extract/Sparkle.framework
          mkdir -p Carthage/Build/Mac
          ditto /tmp/sparkle-extract/Sparkle.framework Carthage/Build/Mac/Sparkle.framework
          ls -la Carthage/Build/Mac/Sparkle.framework
          ls -la Carthage/Build/Mac/Sparkle.framework/Versions/A/Headers | head
          test -f Carthage/Build/Mac/Sparkle.framework/Headers/Sparkle.h

      - name: Stamp build version (SDS-10 10.2)
        run: |
          set -euo pipefail
          TAG="spectacle-test-${{ github.run_number }}"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $TAG" "Spectacle/Supporting Files/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "Spectacle/Supporting Files/Info.plist"

      - name: Build Spectacle (Release, x86_64, 10.13)
        run: |
          set -o pipefail
          xcodebuild -project Spectacle.xcodeproj -target Spectacle -configuration Release SYMROOT=$(pwd)/build OBJROOT=$(pwd)/build MACOSX_DEPLOYMENT_TARGET=10.13 ARCHS=x86_64 ONLY_ACTIVE_ARCH=NO 'OTHER_CFLAGS=-Wno-error=deprecated-declarations' build 2>&1 | tee xcodebuild.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: xcodebuild.log


      - name: Sign with Academy identity (stable designated requirement)
        env:
          ACADEMY_CODESIGN_P12_B64: ${{ secrets.ACADEMY_CODESIGN_P12_B64 }}
          ACADEMY_CODESIGN_P12_PASS: ${{ secrets.ACADEMY_CODESIGN_P12_PASS }}
        run: |
          set -euo pipefail
          APP=$(find ./build/Release -maxdepth 1 -name "Spectacle.app" -type d | head -1)
          test -n "$APP"
          test -n "$ACADEMY_CODESIGN_P12_B64"
          KC="$RUNNER_TEMP/academy-signing.keychain-db"
          KCPASS="$(head -c 48 /dev/urandom | base64 | tr -d '/+=' | head -c 32)"
          security create-keychain -p "$KCPASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KCPASS" "$KC"
          printf '%s' "$ACADEMY_CODESIGN_P12_B64" | base64 --decode > "$RUNNER_TEMP/academy.p12"
          security import "$RUNNER_TEMP/academy.p12" -k "$KC" -P "$ACADEMY_CODESIGN_P12_PASS" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPASS" "$KC" >/dev/null
          rm -f "$RUNNER_TEMP/academy.p12"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security default-keychain -d user -s "$KC"
          IDENTITY=$(security find-identity -p codesigning "$KC" | awk '/Academy Code Signing/ {print $2; exit}')
          test -n "$IDENTITY"
          echo "Signing identity SHA-1: $IDENTITY"
          sign_one() { codesign --keychain "$KC" --force --sign "$IDENTITY" --timestamp=none "$1"; }
          find "$APP" -type d -name "*.xpc" -print0 | while IFS= read -r -d '' p; do sign_one "$p"; done
          find "$APP" -type d -name "*.appex" -print0 | while IFS= read -r -d '' p; do sign_one "$p"; done
          find "$APP" -type d -name "*.app" ! -path "$APP" -print0 | while IFS= read -r -d '' p; do sign_one "$p"; done
          find "$APP" -type f -name "*.dylib" -print0 | while IFS= read -r -d '' p; do sign_one "$p"; done
          find "$APP" -type d -name "*.framework" -print0 | while IFS= read -r -d '' p; do sign_one "$p"; done
          sign_one "$APP"
          codesign --verify --verbose=2 "$APP"

      - name: Verify SDS-10 conformance in built app
        run: |
          set -euo pipefail
          APP=$(find ./build/Release -maxdepth 1 -name "Spectacle.app" -type d | head -1)
          test -n "$APP"
          TAG="spectacle-test-${{ github.run_number }}"
          V=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$APP/Contents/Info.plist")
          echo "CFBundleVersion=$V tag=$TAG"
          test "$V" = "$TAG"
          test "$(shasum -a 256 "$APP/Contents/Resources/startup-sound.wav" | awk '{print $1}')" = "07a113244c6b432b22954a089ce519bd239311b14a48f26ae85214ed8c25b09a"
          test -f "$APP/Contents/Resources/LICENSE-ACADEMY.txt"
          test -f "$APP/Contents/Resources/NOTICE.txt"
          /usr/libexec/PlistBuddy -c "Print :com.detroitautomationacademy.conformance" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :com.detroitautomationacademy.audit" "$APP/Contents/Info.plist"
          test -d "$APP/Contents/_CodeSignature"
          codesign --verify --verbose=2 "$APP"
          codesign -d -r- "$APP" > designated-requirement.txt 2>&1 || true
          cat designated-requirement.txt
          grep -q "designated =>" designated-requirement.txt

      - name: Package
        run: |
          set -euo pipefail
          APP=$(find ./build/Release -maxdepth 1 -name "Spectacle.app" -type d | head -1)
          test -n "$APP"
          ls -la "$APP/Contents"
          ditto -c -k --sequesterRsrc --keepParent "$APP" Spectacle-test.zip
          ls -lh Spectacle-test.zip
          shasum -a 256 Spectacle-test.zip

      - name: Upload survival artifact
        uses: actions/upload-artifact@v4
        with:
          name: Spectacle-test-zip
          path: Spectacle-test.zip

      - name: Upload designated requirement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: designated-requirement
          path: designated-requirement.txt

      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="spectacle-test-${{ github.run_number }}"
          cat > release-notes.md <<'EOF'
          SDS-10 conformance build of Spectacle (tranche SDS10-T2, adapted form per SDS-10 10.4.5).

          - Academy bundle ID: com.detroitautomationacademy.spectacle
          - Version at startup, adapted form: CFBundleVersion is this build's tag (stamped in CI from the run number); SpectacleAppDelegate's showAboutPanel: presents the About panel with the runtime-read build version (SpectacleUtilities.applicationBuildVersion), and installVersionMenuItem adds the same runtime-read version to the status-item menu.
          - Startup sound at first presentation: playStartupSound plays the bundled startup-sound.wav once at launch; the asset is byte-identical to the Academy library master (SHA-256 07a113244c6b432b22954a089ce519bd239311b14a48f26ae85214ed8c25b09a, verified in CI against the built app).
          - Conformance attested in Info.plist: com.detroitautomationacademy.conformance (SDS-10; Logo / VersionAtStartup / StartupSound / MenuBar, 2026-11-10), beside the complete Academy audit entry (com.detroitautomationacademy.audit, 2026-11-10).
          - IP protection: LICENSE-ACADEMY.txt + NOTICE.txt bundled in Resources (Academy layer only; upstream LICENSE ships intact).
          - Sparkle stays 1.22.0 (official prebuilt framework fetched in CI instead of carthage bootstrap); the 2.9.6 + EdDSA migration remains the packaging-tranche decision.
          - NOT rig-verified on High Sierra hardware.
          - Audit findings remain OPEN.
          EOF
          echo "" >> release-notes.md
          echo "Signed in CI with the Academy self-signed code-signing identity (CN \"Academy Code Signing (Self-Signed)\", cert SHA-256 6A:9E:DC:89:7A:11:1E:75:A0:E7:18:3A:92:B8:8E:DD:07:01:D4:20:D1:67:CF:83:92:6E:C9:BA:D1:0F:C1:12). Designated requirement extracted from the shipped bundle:" >> release-notes.md
          cat designated-requirement.txt >> release-notes.md
          gh release create "$TAG" Spectacle-test.zip --prerelease --title "$TAG" --notes-file release-notes.md
